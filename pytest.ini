[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=20
    --ignore=venv
    --ignore=.venv
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow tests
